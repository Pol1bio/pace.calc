<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Calcolatore Tempo e Passo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: schede a barra inferiore, righe a "nastro" come una calcolatrice con scontrino */
:root {
  --bg: #eef2f5;
  --surface: #ffffff;
  --field: #f3f6f8;
  --ink: #14202b;
  --muted: #586775;
  --line: #d3dce3;
  --accent: #0b6e8a;
  --accent-ink: #ffffff;
  --neg: #b4402b;
  --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e161c;
    --surface: #16222b;
    --field: #1d2c37;
    --ink: #e7eef3;
    --muted: #93a4b1;
    --line: #2a3b48;
    --accent: #4cc3e0;
    --accent-ink: #062832;
    --neg: #ff8f78;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e161c;
  --surface: #16222b;
  --field: #1d2c37;
  --ink: #e7eef3;
  --muted: #93a4b1;
  --line: #2a3b48;
  --accent: #4cc3e0;
  --accent-ink: #062832;
  --neg: #ff8f78;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.4;
  display: flex; flex-direction: column; overflow: hidden;
  padding-top: env(safe-area-inset-top);
  -webkit-text-size-adjust: 100%;
}
main { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
section[hidden] { display: none; }
.tab { display: flex; flex-direction: column; gap: 14px; max-width: 560px; margin: 0 auto; padding: 12px 16px 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.card h2 { font-family: var(--display); font-size: 18px; font-weight: 600; margin: 0; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }

.grid-head, .row { display: grid; align-items: center; gap: 6px; }
.t-grid { grid-template-columns: 44px repeat(4, minmax(0, 1fr)) 36px; }
.d-grid { grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1fr) 36px; }
.grid-head { font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; text-transform: uppercase; letter-spacing: .06em; }
.rows { display: flex; flex-direction: column; gap: 8px; }

input[type="text"] {
  width: 100%; min-width: 0; height: 46px; padding: 0 4px;
  background: var(--field); color: var(--ink);
  border: 1px solid var(--line); border-radius: 10px;
  font-family: var(--display); font-size: 20px; font-weight: 500; text-align: center;
  font-variant-numeric: tabular-nums;
}
input[type="text"]::placeholder { color: var(--muted); opacity: .6; }
input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

button { font-family: var(--body); cursor: pointer; }
.sign {
  height: 46px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--field); color: var(--accent);
  font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1;
}
.sign.minus { color: var(--neg); }
.del { height: 36px; width: 36px; border: 0; background: transparent; color: var(--muted); font-size: 22px; border-radius: 8px; }
.actions { display: flex; gap: 8px; }
.btn { flex: 1; height: 44px; border-radius: 10px; font-size: 15px; font-weight: 600; border: 1px solid var(--line); background: var(--field); color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.result { background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--accent); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.res { display: flex; flex-direction: column; gap: 2px; }
.res .lab { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.res .big { font-family: var(--display); font-size: 38px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.res .mid { font-family: var(--display); font-size: 28px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.res .sub { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sep { border: 0; border-top: 1px dashed var(--line); margin: 0; width: 100%; }

.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; text-align: center; }
.arrow { text-align: center; color: var(--muted); font-family: var(--display); font-size: 20px; }


[hidden] { display: none !important; }
.card h3 { font-family: var(--display); font-size: 16px; font-weight: 600; margin: 0; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.seg button { height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-size: 15px; font-weight: 600; }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 0 0 1px var(--line); }
.left { text-align: left !important; }

.res .err { font-size: 14px; color: var(--neg); }
.res .err:empty { display: none; }
.expr { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; min-height: 68px; max-height: 128px; overflow-y: auto; font-family: var(--display); font-size: 26px; font-weight: 500; line-height: 1.35; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.expr .muted { color: var(--muted); font-family: var(--body); font-size: 16px; font-weight: 400; }
.expr .tk { white-space: nowrap; }
.expr .xo { color: var(--accent); font-weight: 700; margin: 0 .3em; }
.expr .xp { color: var(--muted); }
.expr .pend { color: var(--accent); }
.expr .sfx { color: var(--muted); opacity: .6; margin-left: 1px; }
.pad { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.k { height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-family: var(--display); font-size: 24px; font-weight: 600; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.k:active { background: var(--field); }
.k.unit { color: var(--accent); border-color: var(--accent); font-size: 17px; }
.k.fn { background: var(--field); font-size: 20px; }
.k.neg { color: var(--neg); background: var(--field); }
.k.op { background: var(--field); color: var(--accent); font-size: 28px; }
.k.colon { font-size: 28px; }
.k.eq { grid-column: 5; grid-row: 5 / span 2; height: auto; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-size: 32px; display: flex; align-items: center; justify-content: center; }
.hrow { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 10px 0; color: var(--ink); }
.hrow .ht { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.hrow b { font-family: var(--display); font-size: 22px; font-weight: 600; }
.link { border: 0; background: transparent; color: var(--accent); font-weight: 600; font-size: 14px; padding: 10px 0; border-radius: 8px; }

.tab.pace { height: 100%; min-height: 490px; gap: 8px; padding-bottom: 12px; }
.pace .card { padding: 10px 12px; gap: 8px; }
.crow { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 8px; }
.eq1 { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--muted); }
.eq1 b { font-family: var(--display); font-size: 24px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.tcard { flex: 1; min-height: 0; }
.tg { flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(30px, 1fr); column-gap: 18px; }
.tc { display: flex; justify-content: space-between; align-items: center; gap: 6px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.tc:nth-last-child(-n+2) { border-bottom: 0; }
.tc span { font-size: 14px; color: var(--muted); }
.tc b { font-family: var(--display); font-size: 21px; font-weight: 600; }
.srow { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
.solve .result { padding: 6px 12px; }
.solve .result .big { display: block; font-size: 28px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.solve .result .sub { display: block; font-size: 13px; line-height: 18px; min-height: 18px; }
.tab.calc { height: 100%; min-height: 470px; gap: 10px; padding-bottom: 12px; }
.calc .top { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; position: relative; }
.calc .result { flex: none; position: relative; height: 92px; padding: 8px 54px 8px 14px; justify-content: center; gap: 2px; }
.calc .result .big { display: block; font-size: 38px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.calc .result .sub { display: block; font-size: 13px; line-height: 20px; height: 20px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.calc .result .sub.err { color: var(--neg); }
.calc .expr { flex: 1; min-height: 52px; max-height: none; }
.calc .pad { flex: none; }
.expr .zero { color: var(--muted); opacity: .5; }
.ib { position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; font-size: 28px; line-height: 1; }
.ib svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ib:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.hist-panel { position: absolute; inset: 0; z-index: 3; background: var(--bg); display: flex; flex-direction: column; gap: 6px; }
.hp-head { display: flex; justify-content: space-between; align-items: center; padding-left: 4px; font-family: var(--display); font-size: 18px; font-weight: 600; }
.hp-head > span:last-child { display: flex; align-items: center; }
.hp-head .ib { position: static; }
.hp-head .link { padding: 10px 8px; }
.hist-panel #hist { flex: 1; min-height: 0; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 0 14px; }
.hrow:first-child { border-top: 0; }

nav {
  flex: none;
  background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(2, 1fr);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); gap: 6px;
}
nav button {
  height: 52px; border: 0; border-radius: 12px; background: transparent; color: var(--muted);
  font-size: 14px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
nav button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav button[aria-selected="true"] { background: var(--field); color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { button { transition: background .15s, color .15s; } }
</style>
<meta name="apple-mobile-web-app-title" content="Passo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<main>
  <!-- PASSO -->
  <section id="tab-passo" class="tab pace" aria-label="Passo e velocità">
    <div class="card conv">
      <div class="crow">
        <div class="fld">
          <label for="pc-min">Passo min/km</label>
          <div class="pair">
            <input type="text" id="pc-min" inputmode="numeric" autocomplete="off" placeholder="min" aria-label="Minuti per chilometro">
            <input type="text" id="pc-sec" inputmode="decimal" autocomplete="off" placeholder="sec" aria-label="Secondi per chilometro, anche con decimali">
          </div>
        </div>
        <div class="fld">
          <label for="pc-kmh">km/h</label>
          <input type="text" id="pc-kmh" inputmode="decimal" autocomplete="off" placeholder="km/h">
        </div>
      </div>
      <div class="eq1" aria-live="polite"><span><b id="eq-mi">—</b> min/mi</span><span><b id="eq-mph">—</b> mph</span></div>
    </div>

    <div class="card tcard"><div class="tg" id="pc-table" aria-live="polite"></div></div>

    <div class="card solve">
      <div class="seg" role="radiogroup" aria-label="Cosa vuoi calcolare">
        <button type="button" role="radio" data-solve="tempo" aria-checked="true">Tempo</button>
        <button type="button" role="radio" data-solve="passo" aria-checked="false">Passo</button>
        <button type="button" role="radio" data-solve="distanza" aria-checked="false">Distanza</button>
      </div>
      <div class="srow">
        <div class="fld" data-g="dist"><label for="sd-km">km</label><input type="text" id="sd-km" inputmode="decimal" autocomplete="off" placeholder="0"></div>
        <div class="fld" data-g="time"><label for="sd-h">ore</label><input type="text" id="sd-h" inputmode="numeric" autocomplete="off" placeholder="0"></div>
        <div class="fld" data-g="time"><label for="sd-m">min</label><input type="text" id="sd-m" inputmode="numeric" autocomplete="off" placeholder="0"></div>
        <div class="fld" data-g="time"><label for="sd-s">sec</label><input type="text" id="sd-s" inputmode="decimal" autocomplete="off" placeholder="0"></div>
        <div class="fld" data-g="pace"><label for="sp-min">min/km</label><input type="text" id="sp-min" inputmode="numeric" autocomplete="off" placeholder="0"></div>
        <div class="fld" data-g="pace"><label for="sp-sec">sec</label><input type="text" id="sp-sec" inputmode="decimal" autocomplete="off" placeholder="0"></div>
      </div>
      <div class="result" aria-live="polite">
        <div class="res"><span class="big" id="sv-big">—</span><span class="sub" id="sv-sub"></span></div>
      </div>
    </div>
  </section>

  <!-- CALCOLA -->
  <section id="tab-calcola" class="tab calc" aria-label="Calcola" hidden>
    <div class="top">
      <div class="result" aria-live="polite">
        <div class="res"><span class="big" id="rs-big">—</span><span class="sub" id="rs-sub"></span></div>
        <button type="button" class="ib" id="hist-open" aria-label="Cronologia"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3 4v4.5h4.5M12 7.5V12l3 2"/></svg></button>
      </div>
      <div class="expr" id="expr" aria-label="Espressione"></div>
      <div class="hist-panel" id="hist-panel" hidden>
        <div class="hp-head"><span>Cronologia</span><span><button type="button" class="link" id="hist-clear">Svuota</button><button type="button" class="ib" id="hist-close" aria-label="Chiudi">×</button></span></div>
        <div id="hist"></div>
      </div>
    </div>
    <div class="pad" id="pad"></div>
  </section>
</main>

<nav aria-label="Sezioni">
  <button type="button" role="tab" data-tab="passo" aria-selected="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18a8 8 0 1 1 16 0M12 18l4-6"/></svg>Passo</button>
  <button type="button" role="tab" data-tab="calcola" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>Calcola</button>
</nav>

<script>
// LOGIC-START
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : 0; };
const pad = (n, l = 2) => String(n).padStart(l, '0');
const fmtDec = (n, d) => {
  const t = n.toLocaleString('it-IT', { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: false });
  return /^-?0(,0*)?$/.test(t) ? t.replace('-', '') : t.replace('-', '−');   // niente "−0,000"
};

function fmtMs(ms) {
  ms = Math.round(ms);
  const neg = ms < 0; let a = Math.abs(ms);
  const h = Math.floor(a / 3600000); a -= h * 3600000;
  const m = Math.floor(a / 60000); a -= m * 60000;
  const s = Math.floor(a / 1000); const x = a - s * 1000;
  return (neg ? '−' : '') + h + ':' + pad(m) + ':' + pad(s) + '.' + pad(x, 3);
}

const fmtKm = m => fmtDec(m / 1000, 3) + ' km';
const fmtM = m => fmtDec(Math.round(m * 100) / 100, Math.abs(m % 1) < 1e-9 ? 0 : 2) + ' m';

const speedFromPace = p => p > 0 ? 3600 / p : 0;      // p in secondi/km -> km/h
const paceFromSpeed = v => v > 0 ? 3600 / v : 0;      // km/h -> secondi/km
const MI = 1.609344;                                   // km in un miglio
function fmtPace(p, unit) {                            // p in secondi, con decimi: 5:30,5 /km
  if (!(p > 0)) return '—';
  const t = Math.round(p * 10); const m = Math.floor(t / 600); const sec = (t - m * 600) / 10;
  return m + ':' + (sec < 10 ? '0' : '') + fmtDec(sec, 1) + (unit ? ' ' + unit : '');
}
function fmtHms(sec) {                                 // tempo arrotondato al secondo
  const t = Math.round(sec); const h = Math.floor(t / 3600); const m = Math.floor((t - h * 3600) / 60);
  return (h > 0 ? h + ':' + pad(m) : m) + ':' + pad(t - h * 3600 - m * 60);
}
const trim = (n, d) => String(Math.round(n * Math.pow(10, d)) / Math.pow(10, d)).replace('.', ',');

// ---- Calcolatrice a espressioni: tempi, distanze e passi (tempo per km) con + − × ÷ e parentesi ----
const TIME_U = ['h', 'min', 's', 'ms'], DIST_U = ['km', 'mt'];
const UNIT_ABBR = { h: 'h', min: 'min', s: 's', ms: 'ms', km: 'km', mt: 'm' };
const classOf = u => TIME_U.includes(u) ? 'time' : 'dist';
const NAME = { time: 'tempo', dist: 'distanza', pace: 'passo', num: 'numero' };
const OPSYM = { '+': '+', '-': '−', '*': '×', '/': '÷' };
const newCur = () => ({ buf: '', fields: {}, order: [], pace: false });
const newCalc = () => ({ items: [], cur: newCur(), last: null, done: false, err: '', history: [] });
const cloneCur = c => ({ buf: c.buf, fields: { ...c.fields }, order: [...c.order], pace: c.pace });
const curEmpty = c => c.buf === '' && !c.order.length;
const curClass = c => c.order.length ? classOf(c.order[0]) : null;
const lastItem = st => st.items[st.items.length - 1];
const depth = st => st.items.reduce((d, it) => d + (it.k === 'lp' ? 1 : it.k === 'rp' ? -1 : 0), 0);
const isValueEnd = it => !!it && (it.k === 'v' || it.k === 'rp');
function nextUnitOf(c) {                      // dove vanno le cifre scritte dopo un'unità, senza tasto unità
  const list = curClass(c) === 'dist' ? DIST_U : TIME_U;
  return list[Math.min(list.indexOf(c.order[c.order.length - 1]) + 1, list.length - 1)];
}
const curText = c => c.order.map(u => c.fields[u] + UNIT_ABBR[u]).join(' ') + (c.pace ? ' /km' : '');

function closeCur(c) {                        // il valore in corso come elemento dell'espressione, oppure null
  if (curEmpty(c)) return null;
  const k = cloneCur(c);
  if (k.buf.includes(':')) {                    // notazione con i due punti: 5:25 = min:sec, 1:05:25 = ore:min:sec
    const g = k.buf.split(':').map(x => x === '' ? 0 : num(x));
    const [h, m, sec] = g.length === 3 ? g : [0, g[0], g[1]];
    const v = Math.round(((h * 60 + m) * 60 + sec) * 1000);
    return { k: 'v', t: k.pace ? 'pace' : 'time', v, text: k.buf.replace(/:$/, ':00') + (k.pace ? ' /km' : ''), src: k };
  }
  if (k.buf !== '' && k.order.length) {
    const u = nextUnitOf(k); k.fields[u] = k.buf; k.order = k.order.filter(x => x !== u); k.order.push(u); k.buf = '';
  }
  if (!k.order.length) return { k: 'v', t: 'num', v: num(k.buf), text: k.buf, src: k };
  if (curClass(k) === 'time') {
    const v = Math.round(((num(k.fields.h) * 60 + num(k.fields.min)) * 60 + num(k.fields.s)) * 1000 + num(k.fields.ms));
    return { k: 'v', t: k.pace ? 'pace' : 'time', v, text: curText(k), src: k };
  }
  return { k: 'v', t: 'dist', v: num(k.fields.km) * 1000 + num(k.fields.mt), text: curText(k), src: k };
}

function formatRes(r) {                       // time: ms · dist: m · pace: ms per km · num: numero
  if (r.t === 'time') return fmtMs(r.v);
  if (r.t === 'dist') return fmtKm(r.v);
  if (r.t === 'pace') return fmtPace(r.v / 1000, '/km');
  return String(Math.round(r.v * 1e6) / 1e6).replace('.', ',').replace('-', '−');
}
function detailRes(r) {
  if (r.t === 'time') return fmtDec(r.v / 1000, 3) + ' s · ' + fmtDec(r.v / 60000, 3) + ' min';
  if (r.t === 'dist') return fmtM(r.v);
  if (r.t === 'pace' && r.v > 0) return fmtDec(speedFromPace(r.v / 1000), 2) + ' km/h · ' + fmtPace(r.v / 1000 * MI, '/mi');
  return '';
}

function applyOp(op, a, b) {
  const fail = m => { throw new Error(m); };
  if (op === '+') { if (a.t !== b.t) fail('Non puoi sommare ' + NAME[a.t] + ' e ' + NAME[b.t]); return { t: a.t, v: a.v + b.v }; }
  if (op === '-') { if (a.t !== b.t) fail('Non puoi sottrarre ' + NAME[b.t] + ' da ' + NAME[a.t]); return { t: a.t, v: a.v - b.v }; }
  if (op === '*') {
    if (a.t === 'num') return { t: b.t, v: a.v * b.v };
    if (b.t === 'num') return { t: a.t, v: a.v * b.v };
    if (a.t === 'dist' && b.t === 'pace') return { t: 'time', v: a.v / 1000 * b.v };
    if (a.t === 'pace' && b.t === 'dist') return { t: 'time', v: b.v / 1000 * a.v };
    fail('Non puoi moltiplicare ' + NAME[a.t] + ' per ' + NAME[b.t]);
  }
  if (b.v === 0 && (b.t === 'num' || a.t === b.t || (a.t === 'time' && (b.t === 'dist' || b.t === 'pace')))) fail('Divisione per zero');
  if (b.t === 'num') return { t: a.t, v: a.v / b.v };
  if (a.t === b.t) return { t: 'num', v: a.v / b.v };
  if (a.t === 'time' && b.t === 'dist') return { t: 'pace', v: a.v / (b.v / 1000) };
  if (a.t === 'time' && b.t === 'pace') return { t: 'dist', v: a.v / b.v * 1000 };
  fail('Non puoi dividere ' + NAME[a.t] + ' per ' + NAME[b.t]);
}
function evaluate(arr) {                       // arr: [{k:'v',t,v} | {k:'op',op} | {k:'lp'} | {k:'rp'}], × ÷ prima di + −
  let i = 0;
  const isOp = (...ops) => arr[i] && arr[i].k === 'op' && ops.includes(arr[i].op);
  function expr() { let a = term(); while (isOp('+', '-')) { const op = arr[i++].op; a = applyOp(op, a, term()); } return a; }
  function term() { let a = factor(); while (isOp('*', '/')) { const op = arr[i++].op; a = applyOp(op, a, factor()); } return a; }
  function factor() {
    const it = arr[i++];
    if (!it) throw new Error('Espressione incompleta');
    if (it.k === 'v') return { t: it.t, v: it.v };
    if (it.k === 'lp') { const a = expr(); if (!arr[i] || arr[i].k !== 'rp') throw new Error('Parentesi non chiusa'); i++; return a; }
    throw new Error('Espressione incompleta');
  }
  const r = expr();
  if (i < arr.length) throw new Error('Espressione incompleta');
  return r;
}
function buildPreview(st) {                    // espressione "completata": ultimo valore, senza operatori finali, parentesi chiuse
  const arr = st.items.slice(); const tok = closeCur(st.cur); if (tok) arr.push(tok);
  while (arr.length && (arr[arr.length - 1].k === 'op' || arr[arr.length - 1].k === 'lp')) arr.pop();
  if (!arr.length) return null;
  let open = 0; arr.forEach(it => { if (it.k === 'lp') open++; else if (it.k === 'rp') open--; });
  for (let i = 0; i < open; i++) arr.push({ k: 'rp' });
  return arr;
}
function preview(st) {
  const arr = buildPreview(st); if (!arr) return null;
  try { return { ok: true, res: evaluate(arr), arr }; } catch (e) { return { ok: false, msg: e.message, arr }; }
}
function exprText(arr) {
  return arr.map((it, i) => {
    const t = it.k === 'v' ? it.text : it.k === 'op' ? OPSYM[it.op] : it.k === 'lp' ? '(' : ')';
    const prev = arr[i - 1];
    return (!prev || prev.k === 'lp' || it.k === 'rp' ? '' : ' ') + t;
  }).join('');
}

function pressDigit(st, d) {                   // d: '0'-'9' oppure ','
  const c = st.cur;
  if (c.pace || (curEmpty(c) && isValueEnd(lastItem(st)))) return;
  const lastGroup = c.buf.split(':').pop();
  if (d === ',') { if (lastGroup.includes(',')) return; c.buf += lastGroup === '' ? '0,' : ','; return; }
  if (c.buf.replace(/[,:]/g, '').length >= 9) return;
  c.buf = (c.buf === '0' ? '' : c.buf) + d;
}
function pressColon(st) {                      // 5:25 oppure 1:05:25; i decimali solo nell'ultimo gruppo
  const c = st.cur;
  if (c.pace || c.order.length || c.buf === '') return;
  const g = c.buf.split(':');
  if (g.length > 2 || g[g.length - 1] === '' || g[g.length - 1].includes(',')) return;
  c.buf += ':';
}
function pressUnit(st, unit) {                 // assegna le cifre scritte all'unità premuta
  const c = st.cur;
  if (c.pace || c.buf === '' || c.buf.includes(':')) return;
  const cls = curClass(c); if (cls && cls !== classOf(unit)) return;
  c.fields[unit] = c.buf; c.order = c.order.filter(x => x !== unit); c.order.push(unit); c.buf = '';
}
function pressPace(st) {                       // trasforma il tempo in corso in un passo (tempo per km)
  const c = st.cur;
  if (c.buf.includes(':')) { if (!c.buf.endsWith(':')) c.pace = true; return; }
  if (c.buf !== '' && c.order.length && curClass(c) === 'time') pressUnit(st, nextUnitOf(c));
  if (c.order.length && curClass(c) === 'time' && c.buf === '') c.pace = true;
}
function pressOp(st, op) {
  const tok = closeCur(st.cur);
  if (tok) { st.items.push(tok); st.cur = newCur(); }
  if (!st.items.length) {                      // operatore all'inizio: riparte dall'ultimo risultato
    if (!st.last) return;
    st.items.push({ k: 'v', t: st.last.res.t, v: st.last.res.v, text: formatRes(st.last.res), src: null });
  }
  const last = lastItem(st);
  if (last.k === 'op') { last.op = op; return; }
  if (last.k === 'lp') return;
  st.items.push({ k: 'op', op });
}
function pressLP(st) {
  if (!curEmpty(st.cur) || isValueEnd(lastItem(st))) return;
  st.items.push({ k: 'lp' });
}
function pressRP(st) {
  if (depth(st) <= 0) return;
  const tok = closeCur(st.cur);
  if (tok) { st.items.push(tok); st.cur = newCur(); }
  if (!isValueEnd(lastItem(st))) return;
  st.items.push({ k: 'rp' });
}
function pressAns(st, res) {
  if (!res || !curEmpty(st.cur) || isValueEnd(lastItem(st))) return;
  st.items.push({ k: 'v', t: res.t, v: res.v, text: formatRes(res), src: null });
}
function pressBack(st) {                       // cifra, poi parte del passo, poi unità, poi l'elemento precedente
  const c = st.cur;
  if (c.pace) { c.pace = false; return; }
  if (c.buf !== '') { c.buf = c.buf.slice(0, -1); return; }
  if (c.order.length) { delete c.fields[c.order.pop()]; return; }
  const last = st.items.pop(); if (!last) return;
  if (last.k === 'v' && last.src) { st.cur = cloneCur(last.src); pressBack(st); }
}
function pressEq(st) {
  const pv = preview(st);
  if (!pv) return;
  if (!pv.ok) { st.err = pv.msg; return; }       // con = l'errore resta visibile finché premi un altro tasto
  const text = exprText(pv.arr);
  st.last = { text, res: pv.res };
  st.history.unshift(st.last); st.history.length = Math.min(st.history.length, 8);
  st.items = []; st.cur = newCur(); st.done = true;
}
function applyKey(st, k) {                     // un tasto del tastierino
  if (k !== 'eq') { st.done = false; st.err = ''; }
  if (k === 'back') pressBack(st);
  else if (k === 'clear') { st.items = []; st.cur = newCur(); }
  else if (k === 'eq') pressEq(st);
  else if (k === 'ans') pressAns(st, st.last && st.last.res);
  else if (k === 'lp') pressLP(st);
  else if (k === 'rp') pressRP(st);
  else if (k === 'pace') pressPace(st);
  else if (k === ':') pressColon(st);
  else if (k.startsWith('u:')) pressUnit(st, k.slice(2));
  else if (k.startsWith('op:')) pressOp(st, k.slice(3));
  else pressDigit(st, k);
}
// LOGIC-END

const $ = s => document.querySelector(s);

// ---- Scheda Calcola ----
const calc = newCalc();
const PAD = [
  ['u:h', 'ore', 'unit'], ['u:min', 'min', 'unit'], ['u:s', 'sec', 'unit'], ['u:ms', 'ms', 'unit'], ['back', '⌫', 'fn', 'Cancella'],
  ['u:km', 'km', 'unit'], ['u:mt', 'm', 'unit', 'metri'], ['pace', '/km', 'unit', 'Passo: tempo per chilometro'], ['lp', '(', 'fn', 'Apri parentesi'], ['rp', ')', 'fn', 'Chiudi parentesi'],
  ['7', '7'], ['8', '8'], ['9', '9'], ['op:/', '÷', 'op', 'Dividi'], ['clear', 'C', 'neg', "Azzera l'espressione"],
  ['4', '4'], ['5', '5'], ['6', '6'], ['op:*', '×', 'op', 'Moltiplica'], ['ans', 'Ans', 'fn', 'Ultimo risultato'],
  ['1', '1'], ['2', '2'], ['3', '3'], ['op:-', '−', 'op', 'Sottrai'], ['eq', '=', 'eq', 'Calcola'],
  ['0', '0'], [':', ':', 'unit colon', 'Due punti: ore, minuti e secondi'], [',', ','], ['op:+', '+', 'op', 'Somma']
];
$('#pad').innerHTML = PAD.map(([k, l, c, a]) => `<button type="button" class="k ${c || ''}" data-key="${k}"${a ? ` aria-label="${a}"` : ''}>${l}</button>`).join('');

function renderResult() {
  const pv = preview(calc), c = calc.cur;
  let big = '—', sub = '', err = false;
  if (pv && pv.ok) { big = formatRes(pv.res); sub = detailRes(pv.res); }
  else if (pv) { if (calc.err || !(c.buf !== '' && !c.order.length && !c.buf.includes(':'))) { sub = pv.msg; err = true; } }   // niente messaggi mentre scrivi le prime cifre, salvo dopo =
  else if (calc.last) { big = formatRes(calc.last.res); sub = detailRes(calc.last.res); }
  $('#rs-big').textContent = big;
  const el = $('#rs-sub'); el.textContent = sub; el.classList.toggle('err', err);
}
function renderExpr() {
  const box = $('#expr'), c = calc.cur;
  const parts = calc.items.map(it => it.k === 'v' ? `<span class="tk">${it.text}</span>` : it.k === 'op' ? `<span class="xo">${OPSYM[it.op]}</span>` : `<span class="xp">${it.k === 'lp' ? '(' : ')'}</span>`);
  if (!curEmpty(c)) {
    const colon = c.buf.includes(':');
    const done = colon ? (c.pace ? c.buf + ' /km' : '') : curText(c);
    const pend = colon && c.pace ? '' : c.buf;
    const sfx = !colon && c.order.length && c.buf ? UNIT_ABBR[nextUnitOf(c)] : '';
    parts.push(`<span class="tk">${done}${done && pend ? ' ' : ''}<span class="pend">${pend}</span>${sfx ? `<span class="sfx">${sfx}</span>` : ''}</span>`);
  }
  box.innerHTML = parts.length ? parts.join('')
    : calc.done && calc.last ? `<span class="muted">${calc.last.text} =</span>`
    : '<span class="zero">0</span>';
  box.scrollTop = box.scrollHeight;
}
function renderHistory() {
  const h = calc.history;
  $('#hist').innerHTML = h.length
    ? h.map((e, i) => `<button type="button" class="hrow" data-hist="${i}"><span class="ht">${e.text}</span><b>= ${formatRes(e.res)}</b></button>`).join('')
    : '<p class="hint" style="padding:12px 0">Nessun calcolo</p>';
}
function renderCalc() { renderResult(); renderExpr(); renderHistory(); }
const panel = $('#hist-panel');
function openHist(open) { panel.hidden = !open; if (open) renderHistory(); }
$('#pad').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  openHist(false); applyKey(calc, b.dataset.key); renderCalc();
});
$('#hist-open').addEventListener('click', () => openHist(true));
$('#hist-close').addEventListener('click', () => openHist(false));
$('#hist-clear').addEventListener('click', () => { calc.history = []; renderHistory(); });
$('#hist').addEventListener('click', e => {
  const b = e.target.closest('button[data-hist]'); if (!b) return;
  calc.done = false; pressAns(calc, calc.history[+b.dataset.hist].res); openHist(false); renderCalc();
});
// esempio iniziale: 3 km a 5:25/km più 2 km a 5:10/km
'3 u:km op:* 5 : 2 5 pace op:+ 2 u:km op:* 5 : 1 0 pace'.split(' ').forEach(k => applyKey(calc, k));
renderCalc();

// Passo <-> velocità, equivalenti in miglia e tabella delle distanze
const pcMin = $('#pc-min'), pcSec = $('#pc-sec'), pcKmh = $('#pc-kmh');
const DIST = [['400 m', 0.4], ['1 km', 1], ['1 miglio', MI], ['3 km', 3], ['5 km', 5], ['10 km', 10], ['Mezza', 21.0975], ['Maratona', 42.195]];
let exactPace = 0;                                   // secondi/km senza arrotondamenti
function renderPace() {
  const p = exactPace, v = speedFromPace(p), ok = p > 0;
  $('#eq-mi').textContent = ok ? fmtPace(p * MI) : '—';
  $('#eq-mph').textContent = ok ? fmtDec(v / MI, 2) : '—';
  $('#pc-table').innerHTML = DIST.map(([n, d]) => `<div class="tc"><span>${n}</span><b>${ok ? fmtHms(d * p) : '—'}</b></div>`).join('');
}
function fromPace() {
  const p = num(pcMin.value) * 60 + num(pcSec.value);
  exactPace = p;
  pcKmh.value = p > 0 ? trim(speedFromPace(p), 2) : '';
  renderPace();
}
function fromSpeed() {
  const p = paceFromSpeed(num(pcKmh.value));
  exactPace = p;
  if (p > 0) {
    const t = Math.round(p), m = Math.floor(t / 60);          // campi a secondi interi; il valore esatto resta in exactPace
    pcMin.value = m; pcSec.value = t - m * 60;
  } else { pcMin.value = ''; pcSec.value = ''; }
  renderPace();
}
pcMin.addEventListener('input', fromPace); pcSec.addEventListener('input', fromPace);
pcKmh.addEventListener('input', fromSpeed);
pcMin.value = '5'; pcSec.value = '30'; fromPace();

// Calcola tempo, passo o distanza partendo dagli altri due dati
let solve = 'tempo';
const sd = ['#sd-km', '#sd-h', '#sd-m', '#sd-s', '#sp-min', '#sp-sec'].map($);
function calcSolve() {
  const off = solve === 'tempo' ? 'time' : solve === 'passo' ? 'pace' : 'dist';
  document.querySelectorAll('.srow [data-g]').forEach(el => { el.hidden = el.dataset.g === off; });
  const d = num(sd[0].value), T = num(sd[1].value) * 3600 + num(sd[2].value) * 60 + num(sd[3].value);
  const p = num(sd[4].value) * 60 + num(sd[5].value);
  let big = '—', sub = '';
  if (solve === 'tempo') {
    if (d > 0 && p > 0) { big = fmtMs(d * p * 1000); sub = fmtDec(speedFromPace(p), 2) + ' km/h'; }
  } else if (solve === 'passo') {
    if (d > 0 && T > 0) { const q = T / d; big = fmtPace(q, '/km'); sub = fmtDec(speedFromPace(q), 2) + ' km/h · ' + fmtPace(q * MI, '/mi'); }
  } else {
    if (T > 0 && p > 0) { const x = T / p; big = fmtDec(x, 3) + ' km'; sub = fmtDec(x / MI, 3) + ' mi · ' + fmtDec(x * 1000, 0) + ' m'; }
  }
  $('#sv-big').textContent = big; $('#sv-sub').textContent = sub;
}
sd.forEach(i => i.addEventListener('input', calcSolve));
document.querySelectorAll('.seg button[data-solve]').forEach(b => b.addEventListener('click', () => {
  solve = b.dataset.solve;
  document.querySelectorAll('.seg button[data-solve]').forEach(x => x.setAttribute('aria-checked', String(x === b)));
  calcSolve();
}));
['10', '0', '52', '30', '5', '30'].forEach((v, i) => { sd[i].value = v; });
calcSolve();

// Schede: Passo e Calcola. L'indirizzo è #passo o #calcola (anche i vecchi #tempo e #distanza aprono Calcola)
function view(name) {
  const tab = ['calcola', 'tempo', 'distanza'].includes(name) ? 'calcola' : 'passo';
  $('#tab-passo').hidden = tab !== 'passo';
  $('#tab-calcola').hidden = tab !== 'calcola';
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  $('main').scrollTop = 0;
}
function setHash(h) { try { history.replaceState(null, '', '#' + h); } catch (e) { try { location.hash = h; } catch (e2) {} } }
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => { view(b.dataset.tab); setHash(b.dataset.tab); }));
window.addEventListener('hashchange', () => view(location.hash.slice(1)));
view(location.hash.slice(1));
</script>

if ('serviceWorker' in navigator && location.protocol !== 'file:') window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
